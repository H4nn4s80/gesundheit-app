<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Gesundheit</title>
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070a14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gesundheit">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; worker-src 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--APP-->
<section id="lock" class="lock" hidden>
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 41S7 30.5 7 18.5A9.5 9.5 0 0 1 24 13a9.5 9.5 0 0 1 17 5.5C41 30.500 24 41 24 41Z"/><path class="pulse" d="M11 24h8l3-6 4 11 3-5h8"/></svg>
  <h1>Gesundheit</h1>
  <p class="lead">Deine Werte liegen verschlüsselt vor und werden erst auf diesem Gerät geöffnet.</p>
  <form id="unlockForm" autocomplete="on">
    <input type="text" id="username" name="username" autocomplete="username" value="Gesundheit" hidden>
    <label class="sr" for="password">Passwort</label>
    <input class="field" type="password" id="password" name="password" autocomplete="current-password" placeholder="Passwort" required>
    <label class="check"><input type="checkbox" id="remember"><span>Auf diesem Gerät angemeldet bleiben</span></label>
    <button class="primary" id="unlock" type="submit">Entsperren</button>
    <p id="lockMsg" class="msg" role="status"></p>
  </form>
  <button class="link" id="demoBtn" type="button">Mit Beispieldaten ansehen</button>
</section>

<div id="app" hidden>
  <div id="demoBar" class="demoBar" hidden>Beispieldaten, nicht deine Werte</div>
  <main id="view" class="wrap" lang="de"></main>
  <nav class="tabs" aria-label="Hauptnavigation">
    <a href="#heute" data-tab="heute"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.600 18.400 7 17M17 7l1.4-1.4"/></svg><span>Heute</span></a>
    <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 4-7 5 5"/><path d="M3 21h18"/></svg><span>Trends</span></a>
    <a href="#aktivitaeten" data-tab="aktivitaeten"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.500 2.500M9.500 2.500h5"/></svg><span>Aktivitäten</span></a>
    <a href="#koerper" data-tab="koerper"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.500" y="3.500" width="17" height="17" rx="4"/><path d="M8 9.500a5.500 5.500 0 0 1 8 0l-2.500 2.500h-3z"/></svg><span>Körper</span></a>
    <a href="#mehr" data-tab="mehr"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.600"/><circle cx="12" cy="12" r="1.600"/><circle cx="19" cy="12" r="1.600"/></svg><span>Mehr</span></a>
  </nav>
</div>
<!--/APP-->
<script src="app.js"></script>
</body>
</html>
